name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      extension_released: ${{ steps.release.outputs['chromeextension--release_created'] }}
      extension_tag: ${{ steps.release.outputs['chromeextension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-extension:
    needs: release-please
    if: needs.release-please.outputs.extension_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.extension_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: chromeextension

      - name: Build extension zip
        run: npm run zip
        working-directory: chromeextension

      # Keyless auth via Workload Identity Federation - no stored Google
      # credential at all. Setup: GCP project "chrome-tab-router", pool
      # "github-pool" / provider "github-provider" (OIDC, restricted to this
      # repo), service account "chrome-extension-publisher" granted
      # roles/iam.workloadIdentityUser and linked as the Chrome Web Store
      # publisher's service account - see https://developer.chrome.com/docs/webstore/service-accounts
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and publish to Chrome Web Store
        working-directory: chromeextension
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls .output/*.zip)
          curl -sf -H "Authorization: Bearer ${ACCESS_TOKEN}" -X POST \
            -T "${ZIP_FILE}" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload"
          curl -sf -H "Authorization: Bearer ${ACCESS_TOKEN}" -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish"
