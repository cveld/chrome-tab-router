name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      extension_tag:
        description: >-
          Extension tag to (re)publish (e.g. extension-v0.6.0), skipping
          release-please and running publish-extension directly against it.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      extension_released: ${{ steps.release.outputs['chromeextension--release_created'] }}
      extension_tag: ${{ steps.release.outputs['chromeextension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-extension:
    needs: release-please
    if: |
      always() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.extension_released == 'true' || inputs.extension_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXTENSION_TAG: ${{ inputs.extension_tag || needs.release-please.outputs.extension_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXTENSION_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: chromeextension

      - name: Build extension zip
        run: npm run zip
        working-directory: chromeextension

      - name: Upload extension zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromeextension-${{ env.EXTENSION_TAG }}
          path: chromeextension/.output/*.zip
          include-hidden-files: true

      # Keyless auth via Workload Identity Federation - no stored Google
      # credential at all. Setup: GCP project "chrome-tab-router", pool
      # "github-pool" / provider "github-provider" (OIDC, restricted to this
      # repo), service account "chrome-extension-publisher" granted
      # roles/iam.workloadIdentityUser and linked as the Chrome Web Store
      # publisher's service account - see https://developer.chrome.com/docs/webstore/service-accounts
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and publish to Chrome Web Store
        working-directory: chromeextension
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls .output/*.zip)

          upload_status=$(curl -s -o upload_response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" -X POST \
            -T "${ZIP_FILE}" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload")
          cat upload_response.json
          if [ "${upload_status}" -ge 400 ]; then
            echo "Upload failed with HTTP ${upload_status}" >&2
            exit 1
          fi

          publish_status=$(curl -s -o publish_response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish")
          cat publish_response.json
          if [ "${publish_status}" -ge 400 ]; then
            echo "Publish failed with HTTP ${publish_status}" >&2
            exit 1
          fi
